<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketIDE | Launch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Иконки Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #0a0a0a;
      color: #ededed;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .glass-card {
      background: rgba(25, 25, 25, 0.4);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-neutral-900 via-[#0a0a0a] to-black p-4">

  <div class="glass-card p-8 rounded-2xl max-w-sm w-full text-center space-y-6 relative overflow-hidden">
    <!-- Декоративный свичер статуса -->
    <div class="absolute top-4 right-4 flex items-center space-x-2">
      <span class="relative flex h-3 w-3">
        <span id="ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-neutral-500 opacity-75"></span>
        <span id="dot" class="relative inline-flex rounded-full h-3 w-3 bg-neutral-500"></span>
      </span>
      <span id="status-text" class="text-xs text-neutral-500 font-medium">Offline</span>
    </div>

    <!-- Инфо -->
    <div class="pt-4">
      <div class="mx-auto w-12 h-12 bg-neutral-800 rounded-xl border border-neutral-700 flex items-center justify-center mb-4">
        <i data-lucide="terminal" class="w-6 h-6 text-white"></i>
      </div>
      <h1 class="text-2xl font-semibold tracking-tight text-white mb-1">PocketIDE</h1>
      <p class="text-sm text-neutral-400">Cloud environment by Vadym Zelenko</p>
    </div>

    <!-- Кнопка запуска -->
    <a href="https://redesigned-enigma-gj95xv4jx7ghvgq6-8080.app.github.dev" 
       id="start-btn" 
       onclick="handleStart(event)" 
       class="flex items-center justify-center w-full py-3 px-4 bg-white text-black font-medium rounded-lg hover:bg-neutral-200 transition-all duration-200">
      <i data-lucide="power" class="w-4 h-4 mr-2"></i>
      <span>Start Environment</span>
    </a>

    <p id="helper-text" class="text-xs text-neutral-500 h-4 transition-opacity duration-300">
      Tap to wake up Codespace
    </p>
  </div>

  <script>
    lucide.createIcons();

    function handleStart(event) {
      const btn = document.getElementById('start-btn');
      const helper = document.getElementById('helper-text');
      const dot = document.getElementById('dot');
      const ping = document.getElementById('ping');
      const statusText = document.getElementById('status-text');

      // Меняем состояние UI
      btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 mr-2 animate-spin"></i><span>Waking up...</span>';
      btn.classList.add('opacity-70', 'cursor-not-allowed', 'pointer-events-none');
      lucide.createIcons();

      helper.innerText = 'Connecting to GitHub... (10-15s)';
      
      dot.classList.replace('bg-neutral-500', 'bg-amber-500');
      ping.classList.replace('bg-neutral-500', 'bg-amber-500');
      statusText.innerText = 'Booting';
      statusText.classList.replace('text-neutral-500', 'text-amber-500');

      // Кнопка тега <a> сама выполнит переход по href. 
      // При переходе GitHub перехватит загрузку и покажет свой экран запуска сервера.
    }
  </script>
</body>
</html>
